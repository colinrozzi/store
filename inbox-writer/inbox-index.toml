# inbox-dev container WRITER -- INDEX node (mesh_store composite, persist ON, dials the prod cluster).
# Identity: seed "store-inbox-writer" -> pubkey d03bb0f97b56786cf870c33644fbc4300d458bbb0b514e39b6e730de401bc9d0
# This node AUTHORS index writes (name -> hash) from inbox-dev's container; the writes gossip to the
# cluster over the mesh. It must be allow-listed (genesis --allow, OR add-writer on the live cluster).
name = "store-inbox-writer-index"
version = "0.1.0"
package = "/etc/store/mesh_store.wasm"
static_package = true
# TRANSPORT = encrypted static tunnel (b', Colin's call id=77), NOT wireguard. The node dials LOCAL
# tunnel endpoints (127.0.0.1:970x); `store-tunnel client` carries each to a cluster peer over TLS
# (see ../store-tunnel/README.md). listen_addr is loopback (outbound-only join; mesh-dev: gossip is
# bidirectional over the one outbound dial, no inbound needed). Pubkeys are baked (3-node HA peers);
# adjust the set + the client tunnel's --route map to the ACTUAL prod cluster.
initial_state = '{"node_seed":"store-inbox-writer","listen_addr":"127.0.0.1:9600","dial":[{"pubkey":"9c3ec3e2b6b205e7cc1138fe5b55244a5a627cf4b2c08371e518a52ca398ef50","address":"127.0.0.1:9700"},{"pubkey":"b1a19a46c1cf08c6c43fd4d4608ba05334e94d0cdf4087f7aacaaa88c61f5c16","address":"127.0.0.1:9701"},{"pubkey":"06214c3472f6d8b2c8813b78f98e01bffd291c3d12d12bbf6338f36fd74b6369","address":"127.0.0.1:9702"}]}'
[[handler]]
type = "self"
[[handler]]
type = "tcp"
[[handler]]
type = "timer"
[[handler]]
type = "message-server"
[[handler]]
type = "store"
base_path = "/var/lib/store-inbox-writer/index"
store_id = "store"
