[package]
name = "v1b-driver"
version = "0.1.0"
edition = "2021"
[[bin]]
name = "v1b-driver"
path = "src/main.rs"

[dependencies]
# mesh-testkit from your mesh checkout at the composite's rev (github mesh@6ce46de3);
# in-container that's the nix-fetched flake path /nix/store/<hash>-source/tests/testkit.
mesh-testkit = { path = "../../../mesh/tests/testkit" }
store-protocol = { path = "../../store-index/store-protocol" }
sha2 = "0.10"
