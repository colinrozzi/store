[package]
name = "store-driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "store-driver"
path = "src/main.rs"

[dependencies]
# mesh-testkit is the mesh repo's TCP driver (tests/testkit) — a lean Client over the
# node's wire protocol (only ed25519-dalek + sha2). Point this at your mesh checkout at
# the SAME rev as the composite (github mesh@6ce46de3 / tier-1). In-container the source
# is the nix-fetched flake path: /nix/store/<hash>-source/tests/testkit.
mesh-testkit = { path = "../../../mesh/tests/testkit" }
store-protocol = { path = "../store-protocol" }
