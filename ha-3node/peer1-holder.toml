# HA node 1 -- CONTENT holder (content-node, persist ON, serves http /by-hash + the content wire).
name = "store-node-1-holder"
version = "0.1.0"
package = "/etc/store/content_node.wasm"
static_package = true
initial_state = 'role=server;listen=<PEER1_WG_IP>:9710'
[[handler]]
type = "self"
[[handler]]
type = "tcp"
[[handler]]
type = "store"
base_path = "/var/lib/store-node-1/content"
store_id = "holder"
