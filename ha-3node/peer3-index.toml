# HA node 3 -- INDEX (mesh_store composite, persist ON, full-mesh self-healing dial).
# node_seed is a PLACEHOLDER: the real RANDOM seed is injected at deploy from seeds.env (gitignored).
name = "store-node-3-index"
version = "0.1.0"
package = "/etc/store/mesh_store.wasm"
static_package = true
initial_state = '{"node_seed":"<PEER3_SEED>","listen_addr":"<PEER3_WG_IP>:9700","dial":[{"pubkey":"14a05db3d979c59b996c166c28f33ce1a3b8bbb563845690d00f967cf4557438","address":"<PEER1_WG_IP>:9700"},{"pubkey":"cd53e0f738cc1c57de5278c3871a9659406450370ceca9013ea4111f54203011","address":"<PEER2_WG_IP>:9700"}]}'
[[handler]]
type = "self"
[[handler]]
type = "tcp"
[[handler]]
type = "timer"
[[handler]]
type = "message-server"
[[handler]]
type = "store"
base_path = "/var/lib/store-node-3/index"
store_id = "store"
