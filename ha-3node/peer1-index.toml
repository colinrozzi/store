# HA node 1 -- INDEX (mesh_store composite, persist ON, full-mesh self-healing dial).
# node_seed is a PLACEHOLDER: the real RANDOM seed is injected at deploy from seeds.env (gitignored).
name = "store-node-1-index"
version = "0.1.0"
package = "/etc/store/mesh_store.wasm"
static_package = true
initial_state = '{"node_seed":"<PEER1_SEED>","listen_addr":"<PEER1_WG_IP>:9700","dial":[{"pubkey":"cd53e0f738cc1c57de5278c3871a9659406450370ceca9013ea4111f54203011","address":"<PEER2_WG_IP>:9700"},{"pubkey":"90df938e70ef40b472c84e740a6c499398abc3deedce3235210527ae02107698","address":"<PEER3_WG_IP>:9700"}]}'
[[handler]]
type = "self"
[[handler]]
type = "tcp"
[[handler]]
type = "timer"
[[handler]]
type = "message-server"
[[handler]]
type = "store"
base_path = "/var/lib/store-node-1/index"
store_id = "store"
