# HA node 2 -- INDEX (mesh_store composite, persist ON, full-mesh self-healing dial).
# node_seed is a PLACEHOLDER: the real RANDOM seed is injected at deploy from seeds.env (gitignored).
name = "store-node-2-index"
version = "0.1.0"
package = "/etc/store/mesh_store.wasm"
static_package = true
initial_state = '{"node_seed":"<PEER2_SEED>","listen_addr":"<PEER2_WG_IP>:9700","dial":[{"pubkey":"14a05db3d979c59b996c166c28f33ce1a3b8bbb563845690d00f967cf4557438","address":"<PEER1_WG_IP>:9700"},{"pubkey":"90df938e70ef40b472c84e740a6c499398abc3deedce3235210527ae02107698","address":"<PEER3_WG_IP>:9700"}]}'
[[handler]]
type = "self"
[[handler]]
type = "tcp"
[[handler]]
type = "timer"
[[handler]]
type = "message-server"
[[handler]]
type = "store"
base_path = "/var/lib/store-node-2/index"
store_id = "store"
