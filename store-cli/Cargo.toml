[package]
name = "store-cli"
version = "0.1.0"
edition = "2021"
description = "The store CLI: central-authorized publish of a wasm into the store (content holder + name->hash index), and materialize -- resolve a name via the index and fetch+verify the bytes to a content-addressed local path the roster references. Boot stays local; supervisor stays store-agnostic."

[[bin]]
name = "store"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2"
sha2 = { version = "0.10", features = ["oid"] }
store-protocol = { path = "../store-index/store-protocol" }
